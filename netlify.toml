[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Type = "application/x-xz"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=300"
